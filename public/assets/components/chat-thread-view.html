<!-- Chat View for Staff Replies Thread -->
<div id="chatView" class="chat-view" style="display: none;">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChatView()">
      <svg class="icon"><use href="#i-back"/></svg>
    </button>
    <div class="chat-info">
      <h1 class="chat-title" id="chatTitle">Concern Thread</h1>
      <p class="chat-subtitle" id="chatSubtitle">Office • Status</p>
    </div>
  </div>

  <div class="chat-thread" id="chatThread">
    <!-- Messages will be populated here -->
  </div>

  <div class="composer" id="composer">
    <div class="composer-hint" id="composerHint">
      Loading...
    </div>
    <div class="reply-form" id="replyForm" style="display: none;">
      <div class="reply-input-wrap">
        <textarea id="replyInput" placeholder="Type your reply..." rows="3"></textarea>
        <button id="sendReplyBtn" class="send-btn">
          <svg class="icon"><use href="#i-send"/></svg>
        </button>
      </div>
    </div>
    <div class="feedback-form" id="feedbackForm" style="display: none;">
      <h3>How was your experience?</h3>
      <p>Please rate how well we resolved your concern:</p>
      <div class="feedback-rating">
        <button class="emoji-btn" data-rating="1">😞</button>
        <button class="emoji-btn" data-rating="2">😐</button>
        <button class="emoji-btn" data-rating="3">😊</button>
        <button class="emoji-btn" data-rating="4">😄</button>
        <button class="emoji-btn" data-rating="5">🤩</button>
      </div>
      <textarea id="feedbackComment" placeholder="Optional: Tell us more about your experience..." rows="3"></textarea>
      <button id="submitFeedbackBtn" class="feedback-submit-btn">Submit Feedback</button>
    </div>
  </div>
</div>
