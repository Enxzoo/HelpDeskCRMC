<div class="escalation-card">
  <div class="esc-header">
    <h3>Request staff assistance</h3>
  </div>

  <form class="esc-form" data-escalation-form>
    <div class="esc-alert esc-alert-error" style="display: none;" data-error-msg></div>
    <div class="esc-duplicate-notice" data-duplicate-notice role="status" aria-live="polite" tabindex="-1" hidden></div>

    <div class="esc-group">
      <label for="esc-fullname">Full Name <span class="esc-req">*</span></label>
      <input type="text" id="esc-fullname" name="fullName" required>
    </div>

    <div class="esc-row">
      <div class="esc-group">
        <label for="esc-student-number">Student ID number</label>
        <input type="text" id="esc-student-number" name="studentNumber" readonly placeholder="Not provided">
      </div>
      <div class="esc-group">
        <label for="esc-year-level">Year level</label>
        <input type="text" id="esc-year-level" name="yearLevel" readonly placeholder="Not provided">
      </div>
    </div>

    <div class="esc-group">
      <label for="esc-program">Program / Course</label>
      <input type="text" id="esc-program" name="program" readonly placeholder="Not provided">
    </div>

    <div class="esc-row">
      <div class="esc-group">
        <label for="esc-email">Email address <span class="esc-req">*</span></label>
        <input type="email" id="esc-email" name="email" required>
      </div>
      <div class="esc-group">
        <label for="esc-phone">Contact Number <span class="esc-req">*</span></label>
        <input type="tel" id="esc-phone" name="phone" required>
      </div>
    </div>

    <div class="esc-group">
      <label for="esc-office">Category / Office <span class="esc-req">*</span></label>
      <select id="esc-office" name="office" required>
        <option value="">Select an office...</option>
        <optgroup label="Academic Services">
          <option value="registrar">Registrar's Office</option>
          <option value="cashier">Finance</option>
        </optgroup>
        <optgroup label="Student Support">
          <option value="guidance">Guidance Office</option>
          <option value="saso">SASO - Student Affairs</option>
          <option value="library">Library</option>
          <option value="clinic">Clinic</option>
        </optgroup>
        <optgroup label="Departments">
          <option value="cte">College of Teacher Education (CTE)</option>
          <option value="cbe">College of Business Education (CBE)</option>
          <option value="ccs">College of Computer Studies (CCS)</option>
          <option value="cje">College of Justice Education (CCJE)</option>
          <option value="psychology">Psychology Department</option>
        </optgroup>
        <optgroup label="Other">
          <option value="property">Property Custodian</option>
          <option value="itcd">ITCD</option>
          <option value="hr">Human Resources</option>
          <option value="main">General / Main Office</option>
        </optgroup>
      </select>
    </div>

    <div class="esc-group">
      <label for="esc-subject">Subject <span class="esc-req">*</span></label>
      <input type="text" id="esc-subject" name="subject" placeholder="e.g., Transcript of Records Request" required>
    </div>

    <div class="esc-group">
      <label for="esc-concern">Describe your concern <span class="esc-req">*</span></label>
      <textarea id="esc-concern" name="concern" rows="3" required></textarea>
    </div>

    <div class="esc-group">
      <label for="esc-file">Attach files (optional)</label>
      <div class="esc-file-upload">
        <input type="file" id="esc-file" name="attachment" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx" style="display: none;">
        <button type="button" class="esc-file-btn" onclick="document.getElementById('esc-file').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 12.5l6-6a3 3 0 0 1 4.2 4.2l-8 8a5 5 0 1 1-7-7l7-7"/>
          </svg>
          Choose files
        </button>
        <div class="esc-file-list" id="esc-file-list" role="status" aria-live="polite"></div>
      </div>
    </div>

    <button type="submit" class="esc-btn">
      <span data-submit-label>Submit Concern</span>
      <span class="esc-spinner" data-submit-spinner aria-hidden="true" hidden></span>
    </button>
    <p class="esc-analysis-status" data-analysis-status role="status" aria-live="polite" hidden></p>
  </form>

  <div class="esc-success" style="display: none;" data-success-msg>
    <div class="esc-success-icon">✓</div>
    <h3>Concern Forwarded Successfully!</h3>
    <p>Your concern was submitted to the selected office. You can follow staff replies in My Concerns.</p>
    <p class="esc-success-urgency" data-urgency-result></p>
    <p class="esc-success-note">You can track the status of your concern in the <strong>My Concerns</strong> section.</p>
  </div>
</div>
