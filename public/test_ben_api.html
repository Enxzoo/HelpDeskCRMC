<h1>Ben API Direct Test</h1>
<p>This will show exactly what's happening with Ben's API calls.</p>

<input type="text" id="testMessage" placeholder="Type a message to test..." value="hello">
<button onclick="testFirstMessage()">Test First Message (No History)</button>
<button onclick="testWithHistory()">Test With History</button>
<button onclick="clearLogs()">Clear Logs</button>

<div id="output"></div>

<script>
const conversationHistory = [];
const CSRF_TOKEN = '<?php echo htmlspecialchars(csrf_token()); ?>';

function log(message, type = '') {
  const output = document.getElementById('output');
  const div = document.createElement('div');
  div.className = 'log ' + type;
  div.textContent = message;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function clearLogs() {
  document.getElementById('output').innerHTML = '';
  conversationHistory.length = 0;
  log('Logs cleared. Conversation history reset.');
}

async function testFirstMessage() {
  const message = document.getElementById('testMessage').value;
  log('=== TEST 1: First Message (No History) ===');
  log('Message: ' + message);
  log('History: []');

  try {
    const res = await fetch('api/ai_chat.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': CSRF_TOKEN
      },
      body: JSON.stringify({
        message: message,
        history: []
      })
    });

    log('HTTP Status: ' + res.status);
    const data = await res.json();
    log('Full Response:\n' + JSON.stringify(data, null, 2), data.success ? 'success' : 'error');

    if (data.success) {
      conversationHistory.push({ role: 'user', message: message });
      conversationHistory.push({ role: 'model', message: data.answer });
      log('✓ SUCCESS! Added to history. History now has ' + conversationHistory.length + ' messages', 'success');
    } else {
      log('✗ FAILED! Error: ' + (data.error || 'Unknown'), 'error');
    }
  } catch (err) {
    log('✗ EXCEPTION: ' + err.message, 'error');
  }
}

async function testWithHistory() {
  if (conversationHistory.length === 0) {
    log('No history yet. Run "Test First Message" first.', 'error');
    return;
  }

  const message = document.getElementById('testMessage').value;
  log('=== TEST 2: Message With History ===');
  log('Message: ' + message);
  log('History (' + conversationHistory.length + ' messages):\n' + JSON.stringify(conversationHistory, null, 2));

  try {
    const res = await fetch('api/ai_chat.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': CSRF_TOKEN
      },
      body: JSON.stringify({
        message: message,
        history: conversationHistory
      })
    });

    log('HTTP Status: ' + res.status);
    const data = await res.json();
    log('Full Response:\n' + JSON.stringify(data, null, 2), data.success ? 'success' : 'error');

    if (data.success) {
      conversationHistory.push({ role: 'user', message: message });
      conversationHistory.push({ role: 'model', message: data.answer });
      log('✓ SUCCESS! Added to history. History now has ' + conversationHistory.length + ' messages', 'success');
    } else {
      log('✗ FAILED! Error: ' + (data.error || 'Unknown'), 'error');
    }
  } catch (err) {
    log('✗ EXCEPTION: ' + err.message, 'error');
  }
}

log('Ready. Click "Test First Message" to begin.');
</script>
